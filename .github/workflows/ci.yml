name: CI

on:
  push:
  pull_request:

# This job only reads the repository; declaring it here rather than relying on a repository setting keeps the two workflows identical in effect.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest -v
