name: CI

on:
  push:
  pull_request:

# Narrower than the family reference workflow (IADC-Graph-Plugin's ci.yml), which declares no
# permissions block and no persist-credentials override: this repo's default GITHUB_TOKEN scope is
# write, not read, so this line and the checkout step's persist-credentials: false narrow it in the
# file rather than leaving CI running with more access than a read-only test job needs --
# deliberate defence-in-depth, not drift to be synced away.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest -v
